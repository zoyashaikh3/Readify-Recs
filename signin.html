<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Readify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf6f0;
            /* Light beige */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #fff0f5;
            /* Light pink */
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 2px solid #f3d1bf;
            text-align: center;
        }

        h2 {
            font-size: 2rem;
            color: #d57276;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        input {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #d9a5a5;
            font-size: 1rem;
            background-color: #fef9f6;
        }

        input:focus {
            outline: none;
            border-color: #d57276;
        }

        button {
            padding: 0.75rem;
            background-color: #f3d1bf;
            color: #5e4b45;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #d57276;
            color: white;
        }

        .signin-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #5e4b45;
        }

        .signin-link a {
            color: #d57276;
            text-decoration: none;
            font-weight: bold;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Create your Readify account</h2>
        <form>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
            <a href="index.html">Sign Up</a>
        </form>

    </div>

</body>

</html>
